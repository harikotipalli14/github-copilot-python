<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gridline Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="kicker">Daily logic practice</p><h1>Gridline <span>Sudoku</span></h1></div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </header>
    <div class="layout">
      <section class="game-panel" aria-labelledby="game-title">
        <div class="game-heading"><div><p class="eyebrow">Current puzzle</p><h2 id="game-title">Take your time.</h2></div><div id="timer" class="timer" aria-live="polite">00:00</div></div>
        <div id="sudoku-board" class="sudoku-board" role="grid" aria-label="Sudoku puzzle"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <div class="controls">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
          <button id="new-game" class="primary" type="button">New puzzle</button>
          <button id="check-puzzle" type="button">Check puzzle</button>
          <button id="check-solution" type="button">Check solution</button>
          <button id="hint" type="button">Hint</button>
        </div>
      </section>
      <aside class="scores-panel" aria-labelledby="scores-title">
        <div class="scores-heading"><div><p class="eyebrow">Best runs</p><h2 id="scores-title">Top 10</h2></div><span class="score-count">Local</span></div>
        <ol id="scores-list" class="scores-list"></ol>
        <p id="empty-scores" class="empty-scores">Solve a puzzle to make the board.</p>
      </aside>
    </div>
  </main>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
